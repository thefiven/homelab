# Fixes the gap between the documented invocation (ADR-0013 gesture 7,
# site.yml's own header) and its actual behaviour: with no ansible.cfg in
# the tree, `-l <host>` with no `-i` silently targeted nothing from
# /etc/ansible/hosts. `inventory` here is what makes `-l` resolve against
# this repo's real inventory instead.
#
# Relative paths in this file resolve against this file's own directory
# (the repo root), not the caller's cwd. ansible-playbook itself is still
# invoked from the repo root for this file to be discovered at all (Ansible
# only looks for ./ansible.cfg in the current directory, never a parent).
#
# This is additive to, not a replacement for, ADR-0015's
# `-e @host_vars/<node>_secrets.yml` convention: designators keep being
# supplied explicitly per invocation, never implicitly via this file.
[defaults]
inventory = ansible/inventory.yml

# Removes the sftp/scp round-trip for every task's module code and reduces
# the number of SSH connections, relying on `become` not requiring a
# password prompt (true here: base's admin account is NOPASSWD sudo).
# Also the prerequisite the `gitops` role's sops-age secret task (#115)
# needs for its key-over-stdin transfer to never touch a tempfile on
# node1.
pipelining = True
