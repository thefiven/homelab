# NVIDIA's k8s-device-plugin (#105): advertises nvidia.com/gpu as a
# schedulable node resource. The `nvidia` role (#68) already installs the
# driver and nvidia-container-toolkit, and k3s registers the `nvidia`
# containerd runtime on its own, so this DaemonSet is the one piece that
# was still missing, per #102's `0/1 nodes are available: 1 Insufficient
# nvidia.com/gpu`.
#
# Vendored as a plain manifest under clusters/homelab/workloads.yaml's
# Kustomization rather than a HelmRelease: no HelmRepository source exists
# in this repo yet, and NVIDIA ships this exact DaemonSet as a single
# unparameterised static file, so a Helm chart would add a second Flux
# source object for nothing a plain manifest doesn't already do.
#
# Source: https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.19.3/deployments/static/nvidia-device-plugin.yml
# below the original Apache-2.0 header, with this repo's own context
# prepended above it. No longer byte-for-byte: #258 added the ConfigMap
# below and three lines on the DaemonSet's container (env, volume,
# volumeMount) to turn on time-slicing (see that ConfigMap's own comment
# for why). Re-vendoring a newer upstream tag means re-applying those
# three lines by hand.
#
# Copyright (c) 2019, NVIDIA CORPORATION.  All rights reserved.
