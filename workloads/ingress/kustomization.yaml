# Flux's `workloads` Kustomization (clusters/homelab/workloads.yaml) has no
# kustomization.yaml of its own at ./workloads, so kustomize-controller
# generates one on the fly. That generator's own directory walk (fluxcd/pkg
# kustomize_generator.go, scanManifests) stops descending as soon as it
# finds a subdirectory carrying its own kustomization.yaml file, adding the
# whole directory as one resource entry instead of flattening every
# manifest inside it (#133, same reasoning as workloads/backup/
# kustomization.yaml).
#
# cloudflared-deployment.yaml (#180) references the cloudflare-tunnel-token
# Secret by name (secretKeyRef); both it and the Cloudflare API token
# Traefik's DNS-01 solver reads (ansible/roles/k3s/templates/
# traefik-config.yaml.j2, kube-system namespace) came from
# scripts/ingress-secrets-setup (#179), same two-step order
# workloads/backup's restic password followed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets/cloudflare-api-token.sops.yaml
  - secrets/cloudflare-tunnel-token.sops.yaml
  - cloudflared-deployment.yaml
