# Flux's `workloads` Kustomization (clusters/homelab/workloads.yaml) has no
# kustomization.yaml of its own at ./workloads, so kustomize-controller
# generates one on the fly. That generator's own directory walk (fluxcd/pkg
# kustomize_generator.go, scanManifests) stops descending as soon as it
# finds a subdirectory carrying its own kustomization.yaml file, adding the
# whole directory as one resource entry instead of flattening every
# manifest inside it (#133, same reasoning as workloads/immich/
# kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets/restic-repository.sops.yaml
  # Postgres credentials and the Healthchecks.io ping URLs, duplicated from
  # workloads/immich/secrets/immich-postgres.sops.yaml and
  # workloads/observability/secrets/healthchecks-pings.sops.yaml (161-03,
  # 161-04): a Kubernetes Secret is namespace-scoped and this cluster has no
  # cross-namespace secret mechanism (no external-secrets, no reflector), so
  # the CronJobs below need their own copies rather than a secretKeyRef
  # reaching into another namespace. Same plaintext values, re-encrypted for
  # this namespace; #173 named this exact wiring decision as this ticket's
  # to make, not its own. RESTIC_CHECK_PING_URL joined
  # POSTGRES_DUMP_PING_URL in the same file (161-04) rather than a second
  # secret, same reasoning as workloads/observability's own file holding
  # all three Healthchecks pings together.
  - secrets/immich-postgres.sops.yaml
  - secrets/healthchecks-pings.sops.yaml
  - postgres-dump-cronjob.yaml
  - restic-check-cronjob.yaml
