# Static `local` PersistentVolume, same mechanism as postgres-pv.yaml (ADR-0014:
# no CSI driver, no dynamic provisioning: k3s's bundled local-path-provisioner
# is disabled at install).
#
# Backed by the immich-redis ZFS dataset (ansible/roles/zfs/defaults/main.yml,
# #134). ZFS's own default mountpoint for a pool named "state" is /state, with
# no override in that role, so the dataset mounts at /state/immich-redis.
#
# nodeAffinity is required (not a pod-level nodeSelector): this is what the
# scheduler uses to place the StatefulSet's pod on the one node that has this
# path. The label value is the generic Ansible alias k3s's own role applies
# (ADR-0015, #131), never the real OS hostname.
#
# Capacity is declarative only, local volumes enforce nothing; 1Gi is well
# above the RDB snapshot size a 0.5 GiB-memory Redis instance can produce.
# Reclaim policy is Retain: not because this data is irreplaceable (it isn't,
# unlike postgres-pv.yaml's), but because no CSI/provisioner exists here to
# act on Delete (ADR-0014); Retain is the only reclaim policy this mechanism
# actually honours.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-redis
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /state/immich-redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab.local/node
              operator: In
              values:
                - node1
