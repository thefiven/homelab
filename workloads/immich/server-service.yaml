# NodePort, not Ingress: ADR-0011 keeps Immich private-only, reachable over
# LAN or Tailscale, never through the public Cloudflare tunnel. A NodePort
# needs no ingress controller route and is reachable at
# <node-LAN-IP>:32283 and <node-Tailscale-IP>:32283 alike, since both
# addresses terminate on the same node1 kubelet.
#
# 32283 is chosen inside k3s's default NodePort range (30000-32767, no
# override in ansible/roles/k3s), built from Immich's own port 2283 so the
# mapping is legible without cross-referencing anything.
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  type: NodePort
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
      nodePort: 32283
