# Flux's `workloads` Kustomization (clusters/homelab/workloads.yaml) applies
# every manifest under workloads/ with no per-app kustomization.yaml gating
# it, so the Secret in secrets/immich-postgres.sops.yaml needs its target
# namespace to already exist in that same tree — otherwise apply fails with
# "namespaces \"immich\" not found" on every reconcile.
apiVersion: v1
kind: Namespace
metadata:
    name: immich
