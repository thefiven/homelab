# Flux's `workloads` Kustomization (clusters/homelab/workloads.yaml) has no
# kustomization.yaml of its own at ./workloads, so kustomize-controller
# generates one on the fly. That generator's own directory walk (fluxcd/pkg
# kustomize_generator.go, scanManifests) stops descending as soon as it
# finds a subdirectory carrying its own kustomization.yaml file, adding the
# whole directory as one resource entry instead of flattening every
# manifest inside it, which is what makes this file useful: every
# manifest listed below is now picked up automatically, no edit to the
# parent tree required (#133).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets/immich-postgres.sops.yaml
  - postgres-pv.yaml
  - postgres-pvc.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - redis-pv.yaml
  - redis-pvc.yaml
  - redis-service.yaml
  - redis-statefulset.yaml
  - derivatives-pv.yaml
  - derivatives-pvc.yaml
  - server-deployment.yaml
  - server-worker-deployment.yaml
  - server-service.yaml
