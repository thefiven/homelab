# Headless Service pairing the StatefulSet below (its `serviceName` field
# requires a governing Service to exist). Headless (clusterIP: None) gives a
# stable DNS name, immich-redis.immich.svc.cluster.local, and per-pod at
# immich-redis-0.immich-redis.immich.svc.cluster.local; either resolves for
# immich-server and immich-machine-learning.
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
spec:
  clusterIP: None
  selector:
    app: immich-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
