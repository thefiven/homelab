# Binds by name to the static PV in derivatives-pv.yaml, same reasoning as
# postgres-pvc.yaml and redis-pvc.yaml: no StorageClass object exists
# (ADR-0014), so an unset storageClassName here matches the PV's own unset
# storageClassName. `volumeName` pins the match directly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-derivatives
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
  volumeName: immich-derivatives
