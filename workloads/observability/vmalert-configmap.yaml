# vmalert's alerting rules (#168: PromQL for ADR-0004's four original
# categories plus ADR-0017's thermal, and the inhibition wiring that lives
# in alertmanager-configmap.yaml's inhibit_rules, not here).
#
# Four category rule groups, not five. "Backup missed its RPO window" has
# no rule in this file: ADR-0018 amends ADR-0004 on that category's
# *mechanism*, not its existence ("This amends ADR-0004 on the mechanism of
# its third category ... which now reports by silence to an external
# check-in service rather than by a rule evaluated against a metric nothing
# publishes"). A restic dump has no Prometheus metric to alert on and
# ADR-0017 already refused the textfile collector that would have
# manufactured one; the category is instead a Healthchecks.io check pinged
# directly by the backup CronJob, wired in #169 (secret) and #170
# (kustomize check + wire secrets). Writing a dormant PromQL rule for it
# here would invent a metric name nothing will ever export.
#
# A fifth group, watchdog, is not a category at all: it is the heartbeat
# ADR-0018 anchors on node_exporter rather than on `vector(1)`, carrying
# both the Healthchecks witness and node-unreachable's own notification
# (#170).
#
# node-exporter's default collector set (ansible/roles/node-exporter)
# publishes every metric below: `up`, `node_filesystem_*` (filesystem
# collector) and `node_hwmon_*` (hwmon collector). VictoriaMetrics's own
# scrape job is named `node-exporter` (victoriametrics-configmap.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: observability
data:
  rules.yml: |
    groups:
      # Root cause (ADR-0004: "the root cause. Every other alert is
      # inhibited when this one fires"). Scoped to the scrape target, not
      # the whole machine: if node_exporter stops answering while k3s and
      # Alertmanager stay up (a crashed exporter, a network blip between
      # VictoriaMetrics and the host), this still fires and inhibits disk
      # and thermal, which read no data without it. If the whole node dies,
      # Alertmanager dies with it and this alert (like everything else
      # here) never posts. That full-outage case is structurally the
      # Healthchecks Watchdog's job instead (ADR-0018), not vmalert's.
      # `for: 5m` rides out a single missed 60s scrape before treating the
      # gap as real.
      - name: node-unreachable
        rules:
          - alert: NodeUnreachable
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels:
              category: node
            annotations:
              summary: "node_exporter is not being scraped"
              description: >-
                VictoriaMetrics has not scraped node_exporter on
                {{ $labels.instance }} for at least 5 minutes.

      # ADR-0004's second category. Threshold (10% free) and duration are
      # this rule's own implementation detail, not vendor- or ADR-sourced
      # like the thermal thresholds below. `fstype!~...` drops the
      # pseudo-filesystems (tmpfs, overlay, squashfs) that `df`-style
      # collectors always report and that no operator can free space on.
      - name: disk
        rules:
          - alert: DiskSpaceNearFull
            expr: >-
              (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              ) * 100 < 10
            for: 30m
            labels:
              category: disk
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is below 10% free"
              description: >-
                {{ $labels.mountpoint }} ({{ $labels.fstype }}) has
                {{ $value | printf "%.1f" }}% space free for at least 30
                minutes.

      # ADR-0017's fifth category, one category carried on a `sensor`
      # label rather than two ("the two expressions ride one category with
      # the sensor carried on a label"). Both expressions join
      # node_hwmon_temp_celsius against node_hwmon_sensor_label on
      # (chip, sensor, instance): node_exporter's hwmon collector ships the
      # human-readable sensor name (`Tctl`, `Composite`) only as that
      # second, always-1 metric, not as a label on the temperature series
      # itself. Thresholds, durations and the "absolute only, no idle
      # baseline" design are ADR-0017's own decision, not chosen here.
      #
      # Third expression, GPU (#298, resolving risk register 9 and
      # ADR-0022's deferred threshold): nvidia_smi_temperature_gpu, from
      # gpu-exporter-daemonset.yaml (#269), not a node_hwmon series - the
      # GPU is not in hwmon at all (ADR-0017). 93C is NVIDIA's own published
      # "Maximum GPU Temperature" for the RTX 3070 Ti
      # (nvidia.com/en-us/geforce/graphics-cards/30-series/rtx-3070-3070ti/,
      # checked 2026-08-24), the same role Kingston's datasheet ceiling
      # plays for the NVMe expression above: the one figure the vendor
      # publishes for this card, not a forum-estimated throttle point.
      # `for: 15m` matches the CPU expression, not the NVMe one. ADR-0017's
      # own reason for that split is transient length, not which component
      # self-protects ("both components protect themselves" either way,
      # ADR-0017): the CPU's documented transient is a sub-second BIOS
      # spike, the NVMe's are this platform's own multi-minute excursions (a
      # ZFS scrub, the monthly restore check). No equivalent GPU-load
      # transient is measured anywhere in this repo - risk register 9 only
      # captured an idle baseline (35C) - so 15m is the CPU's figure reused
      # rather than a GPU-specific number invented to fill that gap.
      - name: thermal
        rules:
          - alert: Thermal
            expr: >-
              node_hwmon_temp_celsius
              * on(chip, sensor, instance)
              node_hwmon_sensor_label{label="Tctl"} > 85
            for: 15m
            labels:
              category: thermal
              sensor: cpu
            annotations:
              summary: "CPU Tctl above 85C on {{ $labels.instance }}"
              description: >-
                k10temp's Tctl has read above 85C for 15 minutes, the point
                at which the CPU_FAN curve has no lever left (ADR-0017).
          - alert: Thermal
            expr: >-
              node_hwmon_temp_celsius
              * on(chip, sensor, instance)
              node_hwmon_sensor_label{label="Composite"} > 70
            for: 30m
            labels:
              category: thermal
              sensor: nvme
            annotations:
              summary: "NVMe Composite above 70C on {{ $labels.instance }}"
              description: >-
                An NVMe drive's Composite sensor has read above 70C for 30
                minutes, past Kingston's warranted operating ceiling
                (ADR-0017).
          - alert: Thermal
            expr: nvidia_smi_temperature_gpu > 93
            for: 15m
            labels:
              category: thermal
              sensor: gpu
            annotations:
              summary: "GPU temperature above 93C on {{ $labels.instance }}"
              description: >-
                nvidia_smi_temperature_gpu has read above 93C for 15 minutes,
                NVIDIA's published Maximum GPU Temperature for the RTX
                3070 Ti (ADR-0022, #298).

      # ADR-0004's fourth category. Was dormant by construction (#160's scope
      # note: the ingress spec that scrapes Traefik hadn't shipped yet, so
      # `traefik_tls_certs_not_after` had no series to evaluate). The scrape
      # job landed in victoriametrics-configmap.yaml (162-06/#183), so the
      # series exists as soon as Traefik holds any certificate — this rule
      # only stays quiet now for the separate reason that no domain is
      # configured yet either (k3s_traefik_domain has no default,
      # ansible/roles/k3s/defaults/main.yml), so Traefik holds no ACME cert
      # to report on. 14 days of lead time on a gauge documented as "the
      # expiration date of certificates" (Unix timestamp) is this rule's own
      # implementation choice.
      - name: certificate
        rules:
          - alert: CertificateExpiringSoon
            expr: (traefik_tls_certs_not_after - time()) < 14 * 86400
            for: 1h
            labels:
              category: certificate
            annotations:
              summary: "A TLS certificate expires within 14 days"
              description: >-
                traefik_tls_certs_not_after reports less than 14 days of
                validity remaining for {{ $labels.instance }}.

      # ADR-0022's sixth category, `WorkloadDegraded` - the OOMKilled slice
      # only (#299). `kube_pod_container_status_last_terminated_reason` is
      # sticky - kube-state-metrics-deployment.yaml's own comment cites the
      # upstream generator function this follows from - it keeps reporting
      # a container's last restart reason forever, until the next restart
      # changes it, so `reason="OOMKilled"` alone would fire on a container
      # that OOM'd once, weeks ago, and has been healthy since - not the
      # "repeated OOMKills" this category is meant to catch. Joined on
      # (namespace, pod, container) against
      # `kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}`
      # (#268, already allowlisted, already scraped): CrashLoopBackOff only
      # appears after Kubernetes has already backed off repeated failures,
      # so the join is "currently backing off, and the reason was memory" -
      # genuinely repeated, not a stale label. Same reason-label join
      # pattern as the Thermal group's hwmon expressions above.
      # The join's instant vector does not hold continuously, though: a
      # container only reports `waiting_reason: CrashLoopBackOff` while it
      # is actually in that Waiting state, and kubelet's own backoff cycle
      # (10s, 20s, 40s, ... capped at 5m) interrupts that with brief
      # Running/Terminated windows shorter than the 60s scrape interval, so
      # a plain `for: 15m` on the join could keep resetting its pending
      # timer indefinitely and never fire even on a genuinely repeated
      # OOMKill. `max_over_time(...[15m:1m])` reads instead: has this join
      # been true at least once in the trailing 15 minutes, which the
      # sliding window keeps true for the same 15 minutes after the last
      # occurrence, so `for: 5m` on top of it - a small buffer against one
      # flaky scrape, not the detection window itself - is comfortably
      # satisfied without needing an unbroken 15-minute streak. No
      # equivalent transient is measured anywhere in this repo, so the
      # 15-minute lookback reuses the CPU/GPU Thermal duration rather than
      # inventing an OOM-specific number, the same reasoning ADR-0022 used
      # for the GPU Thermal expression's own `for:`.
      #
      # `kube_pod_container_status_waiting_reason` for
      # ImagePullBackOff/CreateContainerConfigError,
      # `kube_deployment_status_replicas_unavailable` and
      # `kube_persistentvolumeclaim_status_phase` stuck Pending - the other
      # three series ADR-0022 named for this category - are wired below
      # (#303). All three are already allowlisted
      # (kube-state-metrics-deployment.yaml, #268) and scraped since #268;
      # this ticket only adds the rules.
      - name: workload-degraded
        rules:
          - alert: WorkloadDegraded
            expr: >-
              max_over_time(
                (
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
                  * on(namespace, pod, container)
                  kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
                )[15m:1m]
              ) == 1
            for: 5m
            labels:
              category: workload-degraded
            annotations:
              summary: "{{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is repeatedly OOMKilled"
              description: >-
                {{ $labels.container }} was seen backing off in
                CrashLoopBackOff with OOMKilled as its last terminated
                reason at least once in the last 15 minutes - a
                memory-limit or leak investigation is needed, this will not
                resolve itself.

          # Flux reconciliation drift (#300, resolving ADR-0022's own gap -
          # that decision found this need had no source yet). gotk_resource_info
          # not gotk_reconcile_condition: the first attempt at this ticket
          # targeted a metric that does not exist on the Flux version this
          # cluster runs (kube-state-metrics-crs-configmap.yaml has the
          # detail). ready="False" rather than != "True": Unknown (startup,
          # or the window right after a spec change before the first
          # reconcile completes) is not the same failure as an object that
          # reconciled once and then broke, and alerting on it would page
          # on ordinary object creation - same reasoning the abandoned
          # gotk_reconcile_condition attempt already settled on, unchanged
          # by the metric switch. for: 15m reuses the Thermal GPU/OOMKilled
          # join duration above, longer than both flux-system
          # Kustomizations' own 10-minute reconcile interval (gotk-sync.yaml,
          # workloads.yaml) so a single attempt that would succeed on retry
          # does not fire. customresource_kind/exported_namespace rather than
          # kind/namespace: kube-state-metrics's own reserved label names for
          # customResourceState metrics. Full reasoning and the cardinality
          # count: ADR-0022 amendment, #300.
          - alert: WorkloadDegraded
            expr: gotk_resource_info{ready="False"} == 1
            for: 15m
            labels:
              category: workload-degraded
            annotations:
              summary: "{{ $labels.customresource_kind }}/{{ $labels.name }} in {{ $labels.exported_namespace }} is not reconciling"
              description: >-
                gotk_resource_info has reported ready="False" for
                {{ $labels.customresource_kind }}/{{ $labels.name }} in
                {{ $labels.exported_namespace }} for at least 15 minutes -
                Flux's own retry loop has already tried again in that
                window, this will not resolve itself.

          # kube_pod_container_status_waiting_reason for the other two
          # reasons ADR-0022 named alongside OOMKilled -
          # CreateContainerConfigError and ImagePullBackOff - plus
          # CrashLoopBackOff itself, not joined to a last-terminated reason
          # this time: this is the general "container is stuck retrying"
          # failure, not only the memory-kill slice the OOMKilled rule above
          # already catches. cloudflared's own CreateContainerConfigError
          # incident (ADR-0020, ADR-0022's literal motivating case: 2 days 6
          # hours across 1231 attempts on a missing secret) is this rule,
          # not the OOMKilled one above (#303).
          # `unless on(namespace, pod, container)` the OOMKilled rule's own
          # join subtracts out exactly the containers that rule already
          # alerts on: without it, a genuinely repeated OOMKill would
          # satisfy both this rule's plain CrashLoopBackOff match and the
          # OOMKilled join above, and because that join drops the `reason`
          # label on its own result, vmalert/Alertmanager would treat the
          # two as different alerts (different label sets) rather than
          # deduplicating - one incident, two ntfy notifications. Excluding
          # here keeps CrashLoopBackOff's non-OOM causes (a bad command, a
          # failing readiness probe, an app that panics on start) covered by
          # this rule while OOM-caused ones stay solely the other rule's.
          # Same flapping the OOMKilled rule's own comment already documents
          # for CrashLoopBackOff applies here too: kubelet's backoff cycle
          # (10s, 20s, 40s, ... capped at 5m) interrupts the Waiting state
          # with brief Running/Terminated windows shorter than the 60s
          # scrape interval, and ImagePullBackOff toggles the same reason
          # label against ErrImagePull across its own backoff cycle - a
          # plain `for:` could keep resetting its pending timer and never
          # fire. Same `max_over_time(...[15m:1m])` / `for: 5m` shape as the
          # OOMKilled rule above, for the same reason: has this reason been
          # true at least once in the trailing 15 minutes.
          - alert: WorkloadDegraded
            expr: >-
              max_over_time(
                (
                  kube_pod_container_status_waiting_reason{reason=~"CreateContainerConfigError|ImagePullBackOff|CrashLoopBackOff"}
                  unless on(namespace, pod, container)
                  (
                    kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
                    * on(namespace, pod, container)
                    kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
                  )
                )[15m:1m]
              ) == 1
            for: 5m
            labels:
              category: workload-degraded
            annotations:
              summary: "{{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is stuck {{ $labels.reason }}"
              description: >-
                {{ $labels.container }} has reported waiting reason
                {{ $labels.reason }} at least once in the last 15 minutes -
                Kubernetes's own retry loop keeps backing off and
                retrying, this will not resolve itself.

          # kube_deployment_status_replicas_unavailable, sustained
          # (ADR-0022). A plain gauge, not a StateSet like the waiting-
          # reason series above: it already reads 0 while healthy and only
          # goes, and stays, nonzero while replicas are actually
          # unavailable, so no join or max_over_time is needed here.
          # `for: 15m` reuses the same duration as the GPU Thermal
          # expression, the OOMKilled join and the Flux rule above (#298,
          # #299, #300) rather than inventing a new one, per ADR-0022's own
          # "for: durations belong on the sustained variants... at
          # implementation time."
          - alert: WorkloadDegraded
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 15m
            labels:
              category: workload-degraded
            annotations:
              summary: "{{ $labels.deployment }} in {{ $labels.namespace }} has unavailable replicas"
              description: >-
                {{ $labels.deployment }} has reported {{ $value }}
                unavailable replica(s) for at least 15 minutes - this will
                not resolve itself without intervention.

          # kube_persistentvolumeclaim_status_phase stuck Pending
          # (ADR-0022). A StateSet metric (one series per phase value,
          # `phase="Pending"` reads 1 while a PVC sits in that phase, 0
          # otherwise, kube-state-metrics's own docs), so `== 1` selects it
          # directly - no join needed. `for: 15m` reuses the same duration
          # as the two rules above, per the same ADR-0022 line.
          - alert: WorkloadDegraded
            expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
            for: 15m
            labels:
              category: workload-degraded
            annotations:
              summary: "{{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is stuck Pending"
              description: >-
                {{ $labels.persistentvolumeclaim }} has reported phase
                Pending for at least 15 minutes - this will not resolve
                itself without intervention.

      # ADR-0018's heartbeat. `up{job="node-exporter"} == 1` rather than
      # `vector(1)`: the moment node_exporter stops being scraped (crashed
      # collector, dead node, dead k3s), this series stops existing and the
      # alert stops firing right along with it, the same way NodeUnreachable
      # above does. Alertmanager then stops posting to Healthchecks'
      # Watchdog ping URL, and Healthchecks' own grace-period silence is the
      # alarm - the one path left for node-unreachable's notification, since
      # Alertmanager can't post about its own node being down (ADR-0018).
      # No `for:`: this alert is meant to be true continuously while
      # healthy, not delayed like the others.
      - name: watchdog
        rules:
          - alert: Watchdog
            expr: up{job="node-exporter"} == 1
            labels:
              category: watchdog
            annotations:
              summary: "Heartbeat: node_exporter is being scraped"
              description: >-
                Always-firing while healthy, per ADR-0018 - its Alertmanager
                route pings Healthchecks.io every 15 minutes, and the
                witness raises the alarm on silence, not on this firing.
