# VictoriaMetrics single-node (ADR-0004: "VictoriaMetrics single-node plus
# VictoriaLogs, with Grafana for dashboards"). Deployment, not StatefulSet:
# same reasoning as workloads/immich/server-deployment.yaml: nothing here
# needs per-replica storage identity, the one PVC is bound by name
# (victoriametrics-pvc.yaml), and replicas stays at 1.
#
# Image pinned to a manifest-list digest for linux/amd64, resolved from
# victoriametrics/victoria-metrics:v1.150.0 (latest stable release,
# 2026-08-17) via the Docker Hub registry API, same pattern
# workloads/immich uses for its own images.
#
# No nodeAffinity/nodeSelector here: victoriametrics-pv.yaml's static
# `local` PV already carries the required nodeAffinity (ADR-0014,
# ADR-0015), which is what the scheduler uses to place this pod on node1.
#
# -retentionPeriod=30d matches ADR-0002's storage-capacity table basis
# ("Observability, 30-day retention"), not VictoriaMetrics's own coincidental
# 31-day default, so the retention window is a decision this file makes
# rather than an accident of the tool's default.
#
# -maxIngestionRate and -search.maxUniqueTimeseries are ADR-0004's
# cardinality guards ("set at the start, not after a first incident").
# ponytail: both values are a generous headroom over node_exporter's own
# series count (#166, one target, on the order of 1,000 series at a 60s
# scrape interval), not a measured ceiling: there is no second scrape
# target yet to size against. Tighten once vmalert (#168) or a real
# incident gives an actual number to size to.
#
# Memory: 1.25 GiB request and limit both, ADR-0004's split. No CPU
# request or limit, matching every other workload in this repo (ADR-0002
# rejects per-service CPU quotas outright).
# strategy: Recreate, not the RollingUpdate default. Same class of bug
# ml-deployment.yaml already documents for its GPU (#136): the default
# surges a second pod before deleting the first, and this Deployment's one
# PVC is RWO, and the surge pod panics (`cannot acquire lock on file
# "/storage/flock.lock"`) forever, since the old pod never released it.
# Recreate deletes the old pod first, freeing the lock before the new one
# is even created. Observed live rolling out #267's scrape config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      serviceAccountName: victoriametrics
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.150.0@sha256:aea44b421244dce14e5bae51be1c45a249f9cc8b6d6e79ef33680776fd514e7f
          args:
            - -storageDataPath=/storage
            - -promscrape.config=/etc/victoriametrics/promscrape.yml
            - -retentionPeriod=30d
            - -maxIngestionRate=1000
            - -search.maxUniqueTimeseries=100000
          # SNMP_TARGET (#270): the NAS's real LAN address, a designator
          # ADR-0015 never lets into a tracked file. Set here from a Secret
          # the `gitops` role creates outside GitOps (same mechanism as
          # ADR-0009's sops-age secret), and referenced from
          # victoriametrics-promscrape-config.yml's snmp-synology job as
          # %{SNMP_TARGET} - VictoriaMetrics's own env-var substitution
          # (lib/envtemplate) leaves an unresolved %{SNMP_TARGET} in place
          # rather than failing, so this only ever breaks that one scrape
          # job. `optional: true` for the same reason at one layer out:
          # every other secretKeyRef in this repository is required
          # because losing that one CronJob or alert route is an
          # acceptable, visible failure, but this Secret backs the single
          # VictoriaMetrics pod every job and every alert scrapes through -
          # required here would turn "the SNMP secret isn't provisioned
          # yet" into CreateContainerConfigError for the entire
          # observability stack, the exact failure class #268 was built to
          # catch, not something this ticket should risk causing.
          env:
            - name: SNMP_TARGET
              valueFrom:
                secretKeyRef:
                  name: snmp-target
                  key: SNMP_TARGET
                  optional: true
            # Same mechanism and same optional: true reasoning as
            # SNMP_TARGET above; node1's own Tailscale IPv4 rather than the
            # NAS's LAN address.
            - name: BLACKBOX_TARGET
              valueFrom:
                secretKeyRef:
                  name: blackbox-target
                  key: BLACKBOX_TARGET
                  optional: true
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: promscrape-config
              mountPath: /etc/victoriametrics
          resources:
            requests:
              memory: 1.25Gi
            limits:
              memory: 1.25Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoriametrics
        - name: promscrape-config
          configMap:
            name: victoriametrics-promscrape-config
