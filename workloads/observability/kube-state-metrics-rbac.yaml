# kube-state-metrics needs its own ServiceAccount and ClusterRole: it reads
# object state (Deployment status, Job status, PVC phase) across every
# namespace, which the default ServiceAccount carries no permission for, the
# same gap victoriametrics-rbac.yaml documents for VictoriaMetrics's own
# discovery client.
#
# Trimmed from upstream's own examples/standard/cluster-role.yaml (v2.20.0),
# which grants list/watch on some 30 resource types across ten API groups so
# every collector KSM ships can run. This ClusterRole keeps only the four
# resources the Deployment's --resources flag actually enables (#268): pods
# and persistentvolumeclaims from the core group, deployments from apps,
# jobs from batch. No tokenreviews/subjectaccessreviews either: those back
# upstream's optional kube-rbac-proxy sidecar for authenticated scraping,
# not used here, same as every other exporter in this file (plain HTTP,
# reachable only in-cluster).
#
# kustomizations/gitrepositories (#300): the customResourceState config
# (kube-state-metrics-crs-configmap.yaml) reads these two Flux CRDs -
# the only Flux custom resource kinds that exist in this repo, same trim
# reasoning as the four built-in resources above.
#
# customresourcedefinitions (#300): kube-state-metrics's customResourceState
# reader (CRDiscoverer) list/watches CRD objects at cluster scope to find
# and track the two above - required "when deploying by manifest" per
# upstream's own customresourcestate-metrics.md, cluster-scoped because
# CustomResourceDefinition itself has no namespace. Missing this is a
# silent failure, not a crash (kubernetes/kube-state-metrics#2098): a
# logged Forbidden error, kube-state-metrics keeps running, gotk_resource_info
# just never appears - the exact "up stays green, metric silently absent"
# shape #300's first attempt already hit once with gotk_reconcile_condition.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability
