# VictoriaMetrics's own scrape config (`-promscrape.config`, ADR-0004:
# "self-scraping ... VictoriaMetrics scrapes Prometheus-format targets on
# its own", removing the separate collector a Prometheus-based stack would
# need). Two target classes: node_exporter (#166), the source both
# ADR-0017's thermal alert and ADR-0004's disk-near-full alert need, and
# Traefik (162-06/#183), the source of `traefik_tls_certs_not_after` that
# CertificateExpiringSoon (vmalert-configmap.yaml, ADR-0018) has been
# alerting on dormant series since #167.
#
# Discovered via the Kubernetes API (`kubernetes_sd_configs`), not a static
# target on a literal IP: ADR-0015 never lets a real designator land in a
# tracked file, and the API's own live objects are exactly the values that
# would otherwise have to be hand-written here. No `api_server`/`tls_config`
# is set on either job: with neither given, VictoriaMetrics falls back to
# the in-cluster config every pod gets for free (the mounted ServiceAccount
# token and CA, victoriametrics-rbac.yaml's grant), the same default
# Prometheus itself documents.
#
# role: node's discovery sets `__address__` to `<node-address>:10250`, the
# kubelet's port; node_exporter listens on 9100 instead (the Debian package
# default, unchanged by ansible/roles/node-exporter), so the relabeling
# below only swaps the port, keeping whatever address the API reports.
#
# scrape_interval: 60s, not VictoriaMetrics's usual 15s starting point:
# ADR-0002 names this explicitly ("forces a 60-second scrape interval
# rather than 15") as one of the three levers that keep the 10 GB/day
# observability write envelope binding.
#
# Three more jobs (#267) scrape the kubelet directly at its own :10250 (the
# port role: node's discovery already sets, so no port-rewrite relabeling
# like node-exporter's), authenticated the same way victoriametrics-rbac.yaml's
# `nodes/metrics` grant expects: the pod's own mounted ServiceAccount token
# as bearer, its mounted CA to verify the kubelet's serving certificate
# (k3s signs it from the same cluster CA, so no insecure_skip_verify).
#
# The three kubelet paths overlap in what they carry, so each job keeps a
# disjoint slice instead of re-collecting what another job already covers
# cheaper elsewhere:
#
# - kubelet-resource (`/metrics/resource`, the KEP-2371 resource-metrics
#   endpoint): container_cpu_usage_seconds_total and
#   container_memory_working_set_bytes, labelled with just
#   container/namespace/pod, no cgroup path, no image, no per-core split.
#   This is the per-container CPU/memory source ADR-0002 asks for; kept as
#   the cheap version rather than cAdvisor's, which emits the identical two
#   names again under a heavier label set (measured live: 160 series total
#   on this node's /metrics/resource against 4035 lines of container_* alone
#   on /metrics/cadvisor). node_/pod_ aggregates ride along at no extra
#   scrape cost.
# - kubelet-cadvisor (`/metrics/cadvisor`): kept only for what
#   /metrics/resource does not carry: container_memory_rss and
#   container_memory_cache (the working-set breakdown) and
#   container_fs_usage_bytes (per-container writable-layer usage). CPU and
#   working-set are deliberately left out of this job's keep list: scraping
#   them here too would double the same series under a second `job` label.
#   `container != ""` drops the cgroup-hierarchy rollups (node/pod-level
#   aggregate entries with no container label) that make up most of that
#   endpoint's raw volume; `id` is labeldropped as the one truly
#   high-cardinality label left (a per-cgroup path, redundant with
#   container/namespace/pod), `name` as a redundant legacy Docker field.
# - kubelet-volume-stats (`/metrics`, the kubelet's general registry, the
#   only one of the three that carries `kubelet_volume_stats_*`): filtered
#   to that one metric family. The plain endpoint also carries the kubelet's
#   own process/workqueue/client-latency metrics, none of which this
#   platform reads, so everything else is dropped rather than ingested and
#   never queried.
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-promscrape-config
  namespace: observability
data:
  promscrape.yml: |
    global:
      scrape_interval: 60s
    scrape_configs:
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.+):\d+'
            target_label: __address__
            replacement: '${1}:9100'
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      # role: pod, not role: endpoints: Traefik's Service
      # (k3s's own kube-system/traefik) only publishes web/websecure as
      # Service ports, never the metrics one (the chart's own default,
      # ports.metrics.expose.default: false) — nothing for role: endpoints
      # to key off. The pod's own metrics container port (9100, Traefik's
      # chart default) is reachable directly at its pod IP regardless, same
      # as any other in-cluster address.
      #
      # role: pod emits one SD entry per container port (node1's own
      # traefik pod carries four: web, websecure, traefik, metrics), so the
      # container-port-name keep below runs before the address rewrite:
      # without it, all four entries survive the label-name filter and get
      # rewritten to the same `<pod-ip>:9100`, one job scraping the same
      # target four times over instead of once.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: traefik
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__address__]
            regex: '(.+):\d+'
            target_label: __address__
            replacement: '${1}:9100'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: kubelet-resource
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/resource
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|node_cpu_usage_seconds_total|node_memory_working_set_bytes|pod_cpu_usage_seconds_total|pod_memory_working_set_bytes'
            action: keep

      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [container]
            regex: '.+'
            action: keep
          - source_labels: [__name__]
            regex: 'container_memory_rss|container_memory_cache|container_fs_usage_bytes'
            action: keep
          - regex: 'id|name'
            action: labeldrop

      # kube-state-metrics (#268): role: pod rather than a static target on
      # the Service's ClusterIP, same reasoning as the traefik job above -
      # one discovery mechanism for every in-cluster target rather than two.
      # kube-state-metrics-deployment.yaml exposes two container ports
      # (http-metrics, telemetry); the port-name keep below picks the one
      # that carries the five series this job reads, the same two-step
      # filter (label first, then port) the traefik job uses for the same
      # reason - without the port filter, both of this pod's SD entries
      # would survive and get scraped as two separate targets.
      #
      # No metric_relabel_configs here: kube-state-metrics-deployment.yaml's
      # own --metric-allowlist flag already restricts what this endpoint
      # exposes to exactly these five series, so filtering again here would
      # be the same restriction enforced twice.
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # gpu-exporter (#269): role: pod, same discovery mechanism as the
      # kube-state-metrics job above. No metric_relabel_configs:
      # gpu-exporter-daemonset.yaml's own --query-field-names flag already
      # restricts nvidia-smi's query to exactly the series this ticket asks
      # for, so filtering again here would be the same restriction enforced
      # twice. `instance` from __meta_kubernetes_node_name rather than the
      # pod name: this exporter is a DaemonSet describing the node's own
      # hardware, the same node-scoped shape as node-exporter and the
      # kubelet jobs below, not a singleton Deployment - and #298's Thermal
      # alert needs `instance` to name the host the way its CPU/NVMe
      # siblings in the same category do.
      - job_name: gpu-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: gpu-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      # snmp-synology (#270): the standard snmp_exporter "Prometheus proxy"
      # pattern (its own README, Prometheus Configuration section) - a
      # static target rewritten into __param_target, then a fixed
      # __address__ pointing at the exporter itself, which does the real
      # SNMP walk against whatever target it was handed. %{SNMP_TARGET} is
      # VictoriaMetrics's own environment-variable substitution
      # (lib/promscrape's envtemplate, unconditional, no flag needed): the
      # NAS's LAN address is a real designator (ADR-0015) and never lands
      # in this tracked file, only in the SNMP_TARGET env var the `gitops`
      # role's task sets on the victoriametrics container from a Secret it
      # creates outside GitOps, the same mechanism ADR-0009's sops-age
      # secret already uses for "a real value that must never be
      # committed."
      - job_name: snmp-synology
        metrics_path: /snmp
        params:
          module: [synology]
          auth: [synology_v2]
        static_configs:
          - targets: ['%{SNMP_TARGET}']
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter.observability.svc.cluster.local:9116

      # blackbox-tailnet (#270): same "Prometheus proxy" pattern as
      # snmp-synology above, upstream's own README Prometheus Configuration
      # section. Port 22 (sshd, `base` role): a plain TCP target the
      # tcp_connect module can dial without a TLS handshake or an HTTP
      # response to parse, on a port this platform already keeps open.
      # %{BLACKBOX_TARGET} is node1's own Tailscale IPv4 (`tailscale ip
      # -4`, the same value the `k3s` role's own --tls-san already uses),
      # set on this container by the `gitops` role the same way
      # %{SNMP_TARGET} is - see that job's own comment for the mechanism.
      #
      # ponytail: this probes node1's own tailnet address from a pod
      # scheduled on node1, which proves the tailnet interface serves
      # traffic but not a genuine cross-site path - there is no second
      # site yet (the move is 2026-09-26, ADR-0020), and the AC this
      # ticket actually has is "probes at least one tailnet endpoint," not
      # "between sites." Point BLACKBOX_TARGET at a second node's tailnet
      # IP once one exists; nothing else here changes.
      - job_name: blackbox-tailnet
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets: ['%{BLACKBOX_TARGET}:22']
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc.cluster.local:9115

      - job_name: kubelet-volume-stats
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_volume_stats_.*'
            action: keep
