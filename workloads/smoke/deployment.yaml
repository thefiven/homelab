# Smoke-test backend (162-04, #181, ADR-0011): traefik/whoami, the Traefik
# team's own smoke-test image — it just echoes its hostname, headers and
# client IP in the response body, exactly what's needed to prove Cloudflare
# Tunnel -> Traefik -> a real pod works before either web stack exists to
# prove it for the first time (#162's own reasoning for this ticket).
#
# namespace: default, matching the existing test-secret.sops.yaml (#101,
# predates the #133 per-workload-namespace convention) - no reason to split
# a one-pod smoke target across two namespaces.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-whoami
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-whoami
  template:
    metadata:
      labels:
        app: smoke-whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0@sha256:80f8bb74f634d45d55967820a702c5fddf01cf92968bb29ed7a3573dd16b0e55
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 16Mi
