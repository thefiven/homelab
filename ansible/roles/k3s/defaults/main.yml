# Defaults for the `k3s` role.
#
# `k3s_role` is deliberately absent, same reasoning as `tailscale_authkey`
# and `nfs_client_nas_host`: this role never guesses whether a node is the
# server or an agent (see the assertion in tasks/main.yml). Set it in
# inventory or host_vars: `k3s_role: server` or `k3s_role: agent`.

# Release channel k3s's own install script (get.k3s.io) resolves a version
# from. ADR-0007 selected "stable" for a low-touch operator trading newest
# features for fewer surprises; not something this platform has ever needed
# to override, but kept as a variable rather than hardcoded in tasks/, same
# pattern as tailscale_track.
k3s_channel: stable

# Server mode only: packaged AddOns disabled at install
# (docs.k3s.io/installation/packaged-components lists coredns, traefik,
# local-storage, metrics-server; servicelb the same way despite having no
# manifest of its own). local-storage disabled here is #70's own acceptance
# criterion, not ADR-0007's call: ADR-0007's Consequences section leaves
# local-path's actual disposition to #19 (storage layout), so treat this as
# a placeholder #19 may revisit, not a settled architectural decision. #22
# (public exposure/ingress) independently decides the other AddOns
# (servicelb, traefik) in its own domain — extend this string
# (space-separated `--disable=<name>` flags) when either lands, no template
# needed for one more flag.
#
# `--default-runtime=nvidia` (#105): k3s auto-detects nvidia-container-runtime
# and registers it as an additional containerd runtime named `nvidia`, but
# never makes it the default (confirmed against node1's own generated
# containerd config and https://docs.k3s.io/advanced) — pods still run under
# plain `runc`, so no NVIDIA driver libraries get injected unless a pod
# explicitly sets `runtimeClassName: nvidia`. Setting the default here once,
# node-wide, is one config line instead of patching every current and future
# GPU manifest (the device plugin's own upstream manifest included) with that
# field. Non-GPU pods are unaffected: nvidia-container-runtime passes through
# to runc when no NVIDIA_VISIBLE_DEVICES is set on the container.
k3s_server_exec_args: --disable=local-storage --default-runtime=nvidia

# Agent mode only: which inventory host is the k3s server to join. No
# default, same reasoning as k3s_role — set it in inventory or host_vars
# once a second node exists.
# k3s_server_node:

# Agent mode only: port the server's API listens on. k3s's own default,
# not something this platform has ever needed to change.
k3s_server_port: 6443

# Server mode only: the node label key PersistentVolume nodeAffinity rules
# reference instead of the real OS hostname k3s registers the node under
# (#131, ADR-0015). Its value is always inventory_hostname, the generic
# Ansible alias (node1, node2, ...).
k3s_node_label_key: homelab.local/node

# Server mode only (#178, ADR-0011): the public wildcard hostname Traefik's
# built-in ACME resolver requests via Cloudflare DNS-01 (main + `*.<domain>`
# SAN), and the contact address Let's Encrypt registers the ACME account
# under (a required field of every certificatesResolvers.<name>.acme block,
# per Traefik's own reference docs). ADR-0011's own Consequences section
# leaves "the domain name(s) themselves ... registrar, actual purchase" to a
# future ticket, so this role never guesses either value: unlike
# k3s_role/k3s_server_node above, an unset value here isn't a broken role
# (tasks/main.yml skips templating the Traefik HelmChartConfig entirely
# until both are set, the same "not bootstrapped yet, skip quietly" shape
# the `gitops` role's sops-age task already uses), so the rest of this
# role's tasks (and every role after it in site.yml) still run against
# node1 in the meantime. Set both in inventory or host_vars once a real
# domain and contact address exist.
# k3s_traefik_domain:
# k3s_traefik_acme_email:

# Server mode only (#178): name/key of the Kubernetes Secret (kube-system,
# SOPS+age, Flux-reconciled per #179) holding the scoped Cloudflare API
# token Traefik's DNS-01 solver reads as an env var. The key doubles as the
# env var name lego's Cloudflare provider expects
# (go-acme.github.io/lego/dns/cloudflare), matching this repo's existing
# secret convention (stringData key == the consumer's env var name, e.g.
# workloads/backup/secrets/restic-repository.sops.yaml's RESTIC_PASSWORD).
# #179 must scope that single token with both Zone:DNS:Edit and
# Zone:Zone:Read on the target zone: lego's Cloudflare provider needs the
# latter to resolve the domain to a Zone ID, and this role only ever wires
# one token (CF_DNS_API_TOKEN), not lego's optional two-token split
# (CF_ZONE_API_TOKEN) — a DNS:Edit-only token fails the challenge at the
# zone-lookup step, not the edit step.
k3s_traefik_cloudflare_secret_name: cloudflare-api-token
k3s_traefik_cloudflare_secret_key: CF_DNS_API_TOKEN
