---
# Role `k3s`: install the orchestrator (#70, ADR-0007). One role, two modes
# selected by `k3s_role`: `server` installs k3s on its default SQLite
# datastore with no `--cluster-init` (ADR-0007's "one server forever");
# `agent` joins an existing server, fetching the join token live from it
# rather than this role ever caching it to disk itself.
#
# Both modes install via get.k3s.io's own script (`curl | sh`), the method
# k3s's own docs recommend, rather than an apt repo pinned like the
# tailscale/nvidia roles: the script downloads a release tarball and
# verifies it against a published sha256sum before installing, which is
# its own integrity check in place of a pinned GPG keyring.
#
# Server mode is now exercised against real hardware (#74). Agent mode
# still has no second node to join, so it remains unexercised — same
# caveat as the `nvidia` and `nfs-client` roles. Both modes lean on the
# install script for idempotency: it hashes the installed binary, systemd
# unit and env file before and after running, and prints "No change
# detected so skipping service start" (source: get.k3s.io's
# `service_enable_and_start`) when nothing needs to change, which is what
# `changed_when` below keys off instead of reimplementing that check.

- name: Assert that k3s_role is set to a supported value
  ansible.builtin.assert:
    that:
      - k3s_role is defined
      - k3s_role in ['server', 'agent']
    fail_msg: >-
      k3s_role is not set to 'server' or 'agent'. This role never ships a
      default for it (see defaults/main.yml); set it in inventory or
      host_vars before running against a real host.
  tags: always

- name: Configure this node as a k3s server
  when: k3s_role == 'server'
  block:
    - name: Install k3s in server mode
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_EXEC: "{{ k3s_server_exec_args }}"
      register: k3s_server_install
      changed_when: "'No change detected' not in k3s_server_install.stdout"

    # Generic node label (#131, ADR-0015): PersistentVolume nodeAffinity
    # rules can reference k3s_node_label_key (defaults/main.yml) instead of
    # the real OS hostname k3s otherwise registers the node under.
    # inventory_hostname is already the generic Ansible alias (node1,
    # node2, ...), never the real hostname (ADR-0015 decision 1), so that's
    # the value written. ansible_facts.hostname (the real OS hostname) is
    # only used transiently below to address the node's own object in the
    # k3s API; it never lands in a label, a tracked file, or anywhere else.
    # (ansible_hostname, the older top-level alias for the same fact, is
    # deprecated as of ansible-core 2.20 in favour of ansible_facts.*.)
    #
    # `until`/`retries` because this runs on every apply, not just once:
    # right after install the API server may not have registered the local
    # node yet, unlike the join-token read in agent mode which waits on an
    # already-running server. Reads the node back as JSON rather than a
    # kubectl jsonpath expression: the label key contains `.` and `/`,
    # which jsonpath needs its own escaping for, but `from_json` needs
    # none, matching how the node lookup below leans on Ansible's own
    # Jinja filters over another kubectl output format.
    - name: Read this node's current labels
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - node
          - "{{ ansible_facts.hostname }}"
          - -o
          - json
      register: k3s_node_json
      until: k3s_node_json.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      check_mode: false

    - name: Label this node with its generic alias
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - label
          - node
          - "{{ ansible_facts.hostname }}"
          - "{{ k3s_node_label_key }}={{ inventory_hostname }}"
          - --overwrite
      changed_when: >-
        (k3s_node_json.stdout | from_json).metadata.labels[k3s_node_label_key]
        | default('') != inventory_hostname

    # #178, ADR-0011: k3s reads any manifest dropped in its server
    # manifests directory and auto-applies it: the documented
    # HelmChartConfig customization path for AddOns it bundles itself
    # (Traefik included), same mechanism the k3s_server_exec_args comment
    # above already points to for the other half of this AddOn's config.
    #
    # Gated, not asserted: k3s_traefik_domain/k3s_traefik_acme_email have no
    # default (defaults/main.yml) because the real domain and contact
    # address aren't decided yet (ADR-0011's own Consequences section). An
    # `assert` here would hard-fail this role's whole server block on
    # node1's every single run until a domain is bought, taking gitops and
    # both nfs-client roles down with it for an unrelated change, the same
    # "skip quietly until the prerequisite exists" shape the `gitops` role's
    # sops-age task already uses for "Flux not bootstrapped yet".
    # `default('', true)` folds an unset *or* explicit YAML-null value to
    # the same empty string, so a bare `k3s_traefik_domain:` left in
    # host_vars (this file's own commented-out example) skips too, instead
    # of templating a literal "None" into the manifest. Computed once so
    # the template task below and its removal counterpart can't disagree.
    - name: Determine whether Traefik's ACME domain and contact are set
      ansible.builtin.set_fact:
        k3s_traefik_acme_configured: >-
          {{ (k3s_traefik_domain | default('', true) | length > 0)
          and (k3s_traefik_acme_email | default('', true) | length > 0) }}

    - name: Template the Traefik HelmChartConfig for Cloudflare DNS-01 ACME
      ansible.builtin.template:
        src: traefik-config.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: "0644"
      when: k3s_traefik_acme_configured

    # Converges the other way too: a domain/email set once and later
    # unset (a reverted choice, not just the never-configured case above)
    # would otherwise leave k3s auto-applying a stale HelmChartConfig
    # forever, this task's absence being the only thing that ever
    # templated it in the first place. k3s doesn't reconcile a *removed*
    # manifest's effects on its own either, but at least nothing keeps
    # reapplying the old domain/email past the point this role stops
    # asking for it.
    - name: Remove the Traefik HelmChartConfig when ACME isn't configured
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        state: absent
      when: not k3s_traefik_acme_configured

- name: Configure this node as a k3s agent
  when: k3s_role == 'agent'
  block:
    - name: Assert that the primary server node is set
      ansible.builtin.assert:
        that:
          - k3s_server_node is defined
          - k3s_server_node | string | length > 0
        fail_msg: >-
          k3s_server_node is not set. This role never ships a default for
          it (see defaults/main.yml); set it to the inventory hostname of
          the k3s server before running an agent against a real host.

    - name: Assert that the primary server node has a known address
      ansible.builtin.assert:
        that:
          - hostvars[k3s_server_node].ansible_host is defined
        fail_msg: >-
          k3s_server_node ('{{ k3s_server_node }}') has no ansible_host set
          in inventory.yml. Fix the inventory entry before running an agent
          against a real host.

    # Delegated, not templated from a fact gathered earlier: this role
    # never caches or persists the token itself, so reading it fresh from
    # the server on every agent run (rather than once into a stored fact)
    # is what "fetches ... via delegated fact" (#70) means in practice.
    #
    # `delegate_to` is templated before `when` is evaluated (a documented
    # ansible-core ordering, not specific to this block), so on a server
    # node — where k3s_server_node is never set — the bare expression blew
    # up with "'k3s_server_node' is undefined" despite the block's `when`
    # correctly excluding server nodes from ever reaching this task. The
    # `| default(inventory_hostname)` only has to make the template render;
    # `when` still prevents this task's module from ever running on a
    # server node.
    - name: Read the join token from the primary server node
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_raw
      delegate_to: "{{ k3s_server_node | default(inventory_hostname) }}"
      no_log: true

    # K3S_TOKEN goes straight from the delegated read into this task's
    # environment: this role writes it to no tempfile and no persisted var
    # file, matching #70's "persists nothing" for its own part. k3s's own
    # install script still writes every K3S_*/CONTAINERD_* env var,
    # including this one, to its systemd env file
    # (/etc/systemd/system/k3s-agent.service.env, mode 0600) so the unit
    # can restart with the same config — that persistence is k3s's, not
    # this role's, and out of its control. no_log covers this task because
    # the token would otherwise appear in the environment dict of any
    # failure output.
    - name: Install k3s in agent mode
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        K3S_URL: "https://{{ hostvars[k3s_server_node].ansible_host }}:{{ k3s_server_port }}"
        K3S_TOKEN: "{{ k3s_node_token_raw.content | b64decode | trim }}"
      register: k3s_agent_install
      # Same "No change detected" gate as the server task above.
      changed_when: "'No change detected' not in k3s_agent_install.stdout"
      no_log: true

# `--tags verify`: proves the "k3s node Ready" invariant
# (docs/reference/platform-state.md) with the cluster's own kubectl instead
# of scripts/check-platform's bash-over-SSH `awk` column check. `-o
# jsonpath` replaces that awk entirely: it reads the Ready condition k3s
# already reports structurally, rather than a fixed column position in
# `--no-headers` text. `argv`, not a shell string: the jsonpath template's
# own embedded quotes (`{"\t"}`, `=="Ready"`) don't survive the `command`
# module's default shlex-splitting of a plain `cmd:` string. Runs only
# where a local kubeconfig exists to read the cluster from, a server in
# this platform's current single-node topology (agent mode isn't
# exercised yet, see this role's header note).
- name: Read every k3s node's Ready condition
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - -o
      - jsonpath={range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}
  register: k3s_node_ready
  changed_when: false
  check_mode: false
  when: k3s_role == 'server'
  tags: verify

- name: Assert every k3s node is Ready
  ansible.builtin.assert:
    that: >-
      k3s_node_ready.stdout_lines
      | map('regex_replace', '^.*\t', '')
      | reject('equalto', 'True')
      | list == []
    fail_msg: >-
      Not every k3s node is Ready: {{ k3s_node_ready.stdout }}
    quiet: true
  when: k3s_role == 'server'
  tags: verify

# `--tags verify`: proves the cert half of platform-state.md's ninth
# invariant (162-06/#183) — "the wildcard cert is issued and not expiring"
# — the same way node-exporter's own verify task proves the eighth
# (ansible/roles/node-exporter/tasks/main.yml): an instant query against
# VictoriaMetrics's own API for the metric the platform already depends on
# (`traefik_tls_certs_not_after`, the series CertificateExpiringSoon alerts
# on, workloads/observability/vmalert-configmap.yaml, ADR-0018), not by
# parsing Traefik's acme.json directly, a file this role has never mounted.
#
# Gated on the same domain/email condition as the HelmChartConfig
# templating task above, but inlined rather than read from
# k3s_traefik_acme_configured: that fact is set by a task with no `verify`
# tag, so it would be undefined on a `--tags verify`-only run. No
# `k3s_role | default('')` guard either (unlike node-exporter's copy of
# this pattern): this role's own "Assert that k3s_role is set" task above
# is tagged `always`, so k3s_role is guaranteed defined here even on a
# verify-only run.
- name: Query VictoriaMetrics for Traefik's certificate-expiry metric
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw
      - /api/v1/namespaces/observability/services/victoriametrics:8428/proxy/api/v1/query?query=traefik_tls_certs_not_after
  register: k3s_traefik_cert_query
  changed_when: false
  check_mode: false
  when: >-
    k3s_role == 'server'
    and (k3s_traefik_domain | default('', true) | length > 0)
    and (k3s_traefik_acme_email | default('', true) | length > 0)
  tags: verify

# 14 days, matching CertificateExpiringSoon's own threshold
# (vmalert-configmap.yaml) rather than a second, independently-chosen
# number for the same fact.
- name: Assert the wildcard certificate is issued and not expiring
  ansible.builtin.assert:
    that:
      - (k3s_traefik_cert_query.stdout | from_json).status == 'success'
      - (k3s_traefik_cert_query.stdout | from_json).data.result | length > 0
      - >-
        (k3s_traefik_cert_query.stdout | from_json).data.result
        | map(attribute='value') | map('last') | map('float')
        | select('lt', (ansible_date_time.epoch | int) + (14 * 86400))
        | list == []
    fail_msg: >-
      Traefik's wildcard certificate is missing or expires within 14 days:
      {{ k3s_traefik_cert_query.stdout }}
    quiet: true
  when: >-
    k3s_role == 'server'
    and (k3s_traefik_domain | default('', true) | length > 0)
    and (k3s_traefik_acme_email | default('', true) | length > 0)
  tags: verify
