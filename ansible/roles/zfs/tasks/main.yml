# Role `zfs`: create ADR-0010's state pool, cap the ARC, and schedule trim.
#
# This is the most dangerous role in the playbook — the only one that writes
# to a partition table. Every task below is written so that a second run, or
# a run against a misidentified machine, destroys nothing: ADR-0010 names
# the state pool as carrying the platform's one irreplaceable slice
# (Immich's Postgres database), and no mirror exists here to absorb a
# mistake.
#
# The system pool is out of scope: it is the ZFS root the installer's
# autoinstall already creates (ADR-0013, gesture 3-4), not something this
# role brings into existence.

- name: Assert that the state disk's serial number is set
  ansible.builtin.assert:
    that:
      - zfs_state_disk_serial is defined
      - zfs_state_disk_serial | string | length > 0
    fail_msg: >-
      zfs_state_disk_serial is not set. This role never ships a default for
      it (see defaults/main.yml); read the serial off the real disk with
      `udevadm info` and set it in inventory or host_vars before running
      against a real host.
  tags: always

- name: Install the ZFS userland
  ansible.builtin.apt:
    name: zfsutils-linux
    state: present
    update_cache: true
    cache_valid_time: 3600

# #116 extracted the designation/import/create logic (formerly fifteen
# tasks resolving the disk, importing, classifying failures, force-
# importing on a hostid mismatch, creating, and verifying the backing
# device) into scripts/provision-state-pool.py, so that logic can be
# exercised by `--self-check` without an NVMe carrying, or not carrying, a
# matching pool. Behaviour is unchanged; only where it lives moved.
# Converted to Python (#251): relies on Ansible's default Python
# auto-discovery already in effect on this host for every other module in
# this play, no ansible_python_interpreter override needed.
- name: Copy the state-pool provisioning script to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/provision-state-pool.py"
    dest: /usr/local/sbin/provision-state-pool.py
    owner: root
    group: root
    mode: "0750"

# `changed_when` keys off the same "No change detected" idiom
# k3s/tasks/main.yml's changed_when already uses, reused rather than
# invented twice. A non-zero exit (multiple disks for one serial, an
# unrecognized import failure, a same-named pool backed by the wrong disk)
# fails this task with the script's own diagnostic detail — nothing here
# recovers from a refusal the script already decided on.
- name: Provision the state pool (import existing, create on a bare disk, verify the backing device)
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/provision-state-pool.py
      --serial {{ zfs_state_disk_serial | quote }}
      --pool {{ zfs_state_pool | quote }}
      {% for key, value in zfs_state_pool_root_properties.items() %}
      -O {{ key }}={{ value }}
      {% endfor %}
  register: zfs_provision_result
  changed_when: "'No change detected' not in zfs_provision_result.stdout"

# Why 5 GiB and not the OpenZFS default: defaults/main.yml.
- name: Read the ARC cap currently in force
  ansible.builtin.slurp:
    src: /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_max_running
  check_mode: false

# The cap applies live: the module accepts this parameter as a write, and
# the ARC shrinks to it on its own. Without this task the value would only
# take effect on the next reboot — exactly the install window where memory
# is tightest.
- name: Apply the ARC cap without waiting for a reboot
  ansible.builtin.shell:
    executable: /bin/sh
    cmd: echo {{ zfs_arc_max_bytes }} > /sys/module/zfs/parameters/zfs_arc_max
  when: zfs_arc_max_running.content | b64decode | trim | int != zfs_arc_max_bytes
  changed_when: true

- name: Persist the ARC cap across reboots
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: |
      # Managed by Ansible, role `zfs`. Manual edits are overwritten.
      options zfs zfs_arc_max={{ zfs_arc_max_bytes }}
    owner: root
    group: root
    mode: "0644"
  notify: Update initramfs

# Handlers normally flush at the end of the play, but `zfs` runs early —
# `tailscale`, `nvidia` and `k3s` still come after it. A failure in any of
# them would carry the notification away unfired, leaving the modprobe.d
# file in place with an initramfs that never picked it up: every outward
# sign of the cap and none of its effect. Flush now, while the guarantee
# still holds.
- name: Rebuild the initramfs now rather than at the end of the play
  ansible.builtin.meta: flush_handlers

# ADR-0010's per-dataset recordsize/atime/copies; defaults/main.yml explains
# which datasets exist and why. The module itself is what makes this
# idempotent: it diffs each dataset's current properties against
# `extra_zfs_properties` and only issues `zfs set` where they differ.
- name: Create the state pool's datasets
  community.general.zfs:
    name: "{{ zfs_state_pool }}/{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties }}"
  loop: "{{ zfs_state_datasets }}"
  loop_control:
    label: "{{ item.name }}"

# `zfs-trim-weekly@.timer` ships with zfsutils-linux — scheduled, not the
# `autotrim` pool property ADR-0010 explicitly rejects for "lower-end
# devices" per upstream's own guidance. Enabling the shipped instantiated
# unit is the whole task; there is no custom timer to author.
- name: Schedule trim on the state pool
  ansible.builtin.systemd_service:
    name: "zfs-trim-weekly@{{ zfs_state_pool }}.timer"
    enabled: true
    state: started

# `--tags verify`: proves the "ZFS pools ONLINE" invariant
# (docs/reference/platform-state.md) with the same tool this role already
# trusts to read pool state, not the bash-over-SSH duplicate in the
# deleted scripts/check-platform (#115). Read-only, so it doesn't depend
# on the import/create logic above and can run against a pool this role
# never had to create or import this pass.
- name: Read ZFS pool health
  ansible.builtin.command:
    cmd: zpool list -H -o name,health
  register: zfs_pool_health
  changed_when: false
  check_mode: false
  tags: verify

- name: Assert every ZFS pool is ONLINE
  ansible.builtin.assert:
    that: >-
      zfs_pool_health.stdout_lines
      | map('regex_replace', '^.*\t', '')
      | reject('equalto', 'ONLINE')
      | list == []
    fail_msg: >-
      Not every ZFS pool is ONLINE: {{ zfs_pool_health.stdout }}
    quiet: true
  tags: verify
