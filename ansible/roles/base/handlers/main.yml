# Handlers only fire after an actual change, which is what makes a second
# run of the playbook genuinely silent (changed=0).

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Rewrites /boot/grub/grub.cfg, which lives on the ZFS boot pool, not on the
# EFI System Partition, so it is unrelated to the ESP mount-order fix below.
- name: Update grub
  ansible.builtin.command:
    cmd: update-grub
  changed_when: true
