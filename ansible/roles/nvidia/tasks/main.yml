# Role `nvidia`: install the GPU driver and the container toolkit, so
# container workloads can request the RTX 3070 Ti as a resource (#68).
#
# Scope stops there. ADR-0002 already retired this card as a desktop/gaming
# GPU: it is a platform resource now (Immich thumbnailing/ML, inference), so
# this role only ever asks for the headless "gpgpu" driver flavour, never
# the desktop one. Wiring nvidia-container-toolkit into containerd's runtime
# config (`nvidia-ctk runtime configure`) is k3s's job once that role
# exists: this role installs the toolkit, it doesn't assume a container
# runtime is already on the box to configure.
#
# Verified against real hardware (#102): `ubuntu-drivers install --gpgpu`
# does not install a `nvidia-driver-*` package (that's the desktop flavour's
# name); it installs a `nvidia-headless-*` metapackage instead, e.g.
# `nvidia-headless-no-dkms-595-server-open`.

- name: Install ubuntu-drivers-common, needed for hardware-driver detection
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    state: present
    update_cache: true
    cache_valid_time: 3600

# The idempotency signal is "a driver package is on disk", not "the driver
# is loaded and working" (`nvidia-smi`): the kernel module doesn't take
# over from nouveau until the box reboots, so gating on the loaded module
# would see the same not-yet-rebooted state on every run after the first
# and reinstall every time. This role doesn't reboot the box; that's a
# separate, human gesture.
#
# `dpkg-query`, not `dpkg -l`: the latter's aligned table is documented as
# for human eyes, not for scripts, while `-W -f` is dpkg's own
# scripting-oriented query format.
- name: List NVIDIA driver packages already installed
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'nvidia-headless-*' 2>/dev/null \
        | awk '$1 == "ii" {print $2}'
  register: nvidia_driver_installed
  changed_when: false
  failed_when: false
  check_mode: false

# `--gpgpu` is Ubuntu's own compute-server selection path (distinct from
# the desktop "recommended" pick `ubuntu-drivers devices` prints); it reads
# the hardware and picks the package itself, so this role never hardcodes a
# driver version to go stale.
- name: Install the recommended NVIDIA driver for GPU-compute workloads
  ansible.builtin.command:
    cmd: ubuntu-drivers install --gpgpu
  when: nvidia_driver_installed.stdout_lines | length == 0
  changed_when: true

# The gpgpu driver metapackage's headless-* flavour ships no host binaries
# at all, nvidia-smi included: confirmed against real hardware (#105) when
# scripts/check-platform's own GPU pod hit "exec: nvidia-smi: executable
# file not found in $PATH" — the binary was missing on the host, so
# nvidia-container-toolkit's utility mount (NVIDIA_DRIVER_CAPABILITIES=
# utility) had nothing to bind-mount into the container.
# nvidia-utils-<version>-server is the separate package that ships it.
# Its version is read back from whichever nvidia-headless-* package the
# task above actually installed, same reasoning as that task's own
# --gpgpu pick: never hardcode a driver version to go stale.
- name: List NVIDIA headless driver packages now installed
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'nvidia-headless-*' 2>/dev/null \
        | awk '$1 == "ii" {print $2}'
  register: nvidia_headless_installed
  changed_when: false
  failed_when: nvidia_headless_installed.stdout_lines | length == 0
  check_mode: false

- name: Install the matching nvidia-utils package (provides nvidia-smi)
  ansible.builtin.apt:
    name: "nvidia-utils-{{ nvidia_headless_installed.stdout_lines[0] | regex_search('[0-9]+') }}-server"
    state: present

# Source: NVIDIA's documented apt install
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html).
# The key is ASCII-armored at this URL, unlike Tailscale's already-dearmored
# one, hence the explicit dearmor step below instead of a straight get_url.
- name: Fetch the NVIDIA Container Toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  register: nvidia_container_toolkit_key

# Gating only on the fetch's own `changed` would leave the apt source below
# permanently pointed at a missing keyring if the dearmor step below it were
# ever interrupted, or the .gpg file deleted, without the upstream .asc
# content itself changing: the fetch would then report changed=false forever
# and this task would keep skipping. Re-checking the keyring's own existence
# is what makes a broken keyring self-heal on the next run.
- name: Check whether the dearmored keyring already exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  register: nvidia_container_toolkit_keyring

- name: Dearmor the NVIDIA Container Toolkit signing key
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      /usr/share/keyrings/nvidia-container-toolkit.asc
  when: nvidia_container_toolkit_key.changed or not nvidia_container_toolkit_keyring.stat.exists
  changed_when: true

# Written directly rather than fetched: NVIDIA serves this as a static
# one-line file (flat repo, no suite/component structure; the trailing
# `/` is not a typo), so re-downloading it every run would be a second
# network round-trip for text this role already knows.
- name: Install the NVIDIA Container Toolkit apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    content: |
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
    owner: root
    group: root
    mode: "0644"
  register: nvidia_container_toolkit_repo_file

- name: Install the nvidia-container-toolkit package
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: "{{ nvidia_container_toolkit_repo_file.changed }}"

# `--tags verify`: proves the "GPU visible to a pod" invariant
# (docs/reference/platform-state.md) next to the driver and toolkit it's
# proving, moved verbatim in behaviour from scripts/check-platform's
# heredoc (still there until the companion `gitops` ticket retires it):
# schedule a real pod and run nvidia-smi inside it, not just read
# status.allocatable on the node, so this keeps proving what #105 showed
# matters: that a container can actually use the GPU. `argv`, not a shell
# string, so the JSON --overrides value never has to survive a second
# round of shell quoting.
#
# Runs only where a local kubeconfig exists to schedule against, a server
# in this platform's current single-node topology (agent mode isn't
# exercised yet, see the `k3s` role's header note). `| default('')`, not a
# bare `k3s_role == 'server'`: this role runs before `k3s` in site.yml, so
# on a host where k3s_role is still unset this must skip quietly rather
# than crash on an undefined variable ahead of the `k3s` role's own,
# friendlier assert.
- name: Prove the GPU is visible to a scheduled pod
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - run
      - nvidia-verify-gpu
      - --rm
      - -i
      - --restart=Never
      - --image={{ nvidia_gpu_check_image }}
      - --overrides={"apiVersion":"v1","kind":"Pod","spec":{"containers":[{"name":"nvidia-verify-gpu","image":"{{ nvidia_gpu_check_image }}","command":["nvidia-smi","-L"],"resources":{"limits":{"nvidia.com/gpu":"1"}}}]}}
      - --command
      - --
      - nvidia-smi
      - -L
  register: nvidia_gpu_verify
  changed_when: false
  when: k3s_role | default('') == 'server'
  tags: verify
