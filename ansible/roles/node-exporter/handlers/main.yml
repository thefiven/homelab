# Handlers only fire after an actual change, matching the `zfs` role's own
# reasoning. Order here is the order they run in (Ansible runs handlers in
# handlers/main.yml's own order, not notification order): the unit file
# override has to be reloaded into systemd before a restart can pick it up.

- name: Reload the systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
