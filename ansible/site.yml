---
# Master playbook (ADR-0013, gesture 7), run from the repo root so the
# committed ../ansible.cfg is discovered:
#   ansible-playbook ansible/site.yml -l <host>
# Add --tags verify to prove the platform's invariants instead of mutating
# it (docs/reference/platform-state.md).
#
# Role list is ADR-0013's decision. Uncomment each remaining role as it's
# authored, this file is the template they land in, not a stub to replace.
- name: Configure homelab nodes
  hosts: all
  become: true
  roles:
    - base        # packages, SSH, chrony, unattended-upgrades, GRUB, ESP/ZFS mount-order fix
    - node-exporter # host metrics for the thermal/disk alerts (ADR-0017), MemoryMax-capped
    - zfs         # state-pool creation, ARC cap, scheduled trim
    - tailscale   # enrollment
    - nvidia      # driver + nvidia-container-toolkit (#68), before k3s so the runtime exists at k3s's first start
    - k3s         # server/agent mode (#70)
    - gitops      # Flux health + sops-age secret (#115), needs a running k3s
    - nfs-client  # NAS mounts for Immich originals (#69)
    # Second invocation of the same role, mounting a distinct NAS export for
    # the restic repository (#172, ADR-0012: "distinct from the Immich
    # originals/derivatives exports"). Ansible runs a role again when its
    # params differ from an earlier invocation, so this needs no change to
    # the role itself: nfs-client's assert/mount/verify tasks are already
    # generic over any host/export_base/local_root/mounts combination.
    # nfs_client_restic_nas_export_base is a real designator (ADR-0015):
    # set it in the gitignored ansible/host_vars/node1_secrets.yml, same as
    # nfs_client_nas_export_base above but pointing at the NAS shared folder
    # backing the restic repository, not the Immich originals.
    - role: nfs-client
      vars:
        nfs_client_local_root: /srv/backup
        nfs_client_nas_export_base: "{{ nfs_client_restic_nas_export_base }}"
        nfs_client_mounts:
          - restic
