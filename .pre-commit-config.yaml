# Pre-commit scanning (ADR-0009 and its ADR-0016 amendment): the same
# config a local hook and CI both run, so the two can never diverge.
#
# 1. sops-metadata-policy, local (scripts/check-sops-secrets). Enforces this
#    repo's own path convention (secrets/.*\.ya?ml$, from .sops.yaml): any
#    such file must be SOPS-encrypted.
# 2. gitleaks, pattern-matches likely secret material anywhere in the
#    working tree (entry overridden below), the backstop for values pasted
#    somewhere the path convention doesn't cover. False positives (a
#    documented example key, never a real secret) go in .gitleaksignore.
# 3. shellcheck, scripts/*'s Bash top-level scripts (not scripts/lib/, a
#    sourced-only library, never invoked directly; not *.py, converted
#    scripts under the same directory - see #252).
# 4. black, isort, flake8: the same coverage for scripts/*.py as shellcheck
#    gives the Bash scripts (#252). isort uses black's import profile and
#    flake8 ignores the rules black intentionally violates, so the three
#    never fight over the same line - see pyproject.toml/.flake8.
# 5. ansible-lint, ansible/ only (.ansible-lint excludes the Flux-generated
#    clusters/ and the mixed-provenance workloads/).
#
# Install once per checkout:
#   python3 -m venv .venv && .venv/bin/pip install pre-commit && .venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: sops-metadata-policy
        name: SOPS metadata policy (secrets/ must be encrypted)
        entry: scripts/check-sops-secrets
        language: script
        # Unanchored, matching .sops.yaml's own path_regex exactly: SOPS
        # matches that regex unanchored too, so a nested path like
        # apps/foo/secrets/bar.yaml is in scope for both.
        files: secrets/.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Upstream's default entry scans `git ... --staged`: correct for a
        # local commit hook, but empty (and so vacuously green) against a
        # plain CI checkout, which has nothing staged. --no-git scans the
        # working tree directly instead, so local and CI see the same thing.
        entry: gitleaks detect --no-git --redact --no-banner

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows the `source=` directive scripts/sops-age-setup uses for
        # scripts/lib/wizard.sh; -P SCRIPTDIR resolves it relative to the
        # file being checked, not the CWD pre-commit/CI happens to run from.
        args: [-x, -P, SCRIPTDIR]
        files: ^scripts/[^/]+$
        exclude: \.py$

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        files: ^scripts/[^/]+\.py$

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        files: ^scripts/[^/]+\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^scripts/[^/]+\.py$

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
